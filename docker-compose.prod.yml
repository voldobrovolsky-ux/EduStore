# EduStore — продакшн-стек на одном VPS. Caddy(443, авто-SSL) → web(nginx, SPA+/api) → api → postgres.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Первый деплой — засеять демо-структуру: docker compose -f docker-compose.prod.yml exec api npm run seed
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

  asr:
    build: ./services/asr
    restart: unless-stopped
    environment:
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_MOCK: ${ASR_MOCK:-0}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: "3000"
      ASR_URL: http://asr:8001
      WEB_ORIGIN: https://edustore-flor-group.ru
      AUTH_MODE: ${AUTH_MODE:-production}
      # Флёрус (ADR-0005) — заполнить в .env.prod
      FLOR_ISSUER: ${FLOR_ISSUER}
      FLOR_CLIENT_ID: ${FLOR_CLIENT_ID}
      FLOR_CLIENT_SECRET: ${FLOR_CLIENT_SECRET}
      FLOR_REDIRECT_URI: https://edustore-flor-group.ru/api/auth/flor/callback
      FLOR_POST_LOGOUT_REDIRECT_URI: https://edustore-flor-group.ru
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
